name: build_scalelib

on:
  push:
    branches: 
      - feature/scalelib_build
  workflow_dispatch: 

permissions:
  contents: read

env:
  SCALE_VERSION: "5.5.5"
  SCALE_SYS: Linux64-gnu-ompi
  PACKAGE_NAME: scalelib_ubuntu_latest_ubuntu2404_gnu_ompi

jobs:
  build:
    name: Build SCALE library
    runs-on: ubuntu-24.04

    steps:
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            build-essential \
            gfortran \
            libnetcdf-dev \
            libnetcdff-dev \
            openmpi-bin \
            libopenmpi-dev \
            openssh-client \
            rsync \
            zip \
            curl  
    
    - name: Show build environment
      run: |
        echo "=== OS ==="
        cat /etc/os-release

        echo "=== Fortran compiler ==="
        gfortran --version
        mpifort --version

        echo "=== MPI ==="
        mpirun --version

        echo "=== NetCDF ==="
        nc-config --version
        nf-config --version
    
    - name: Download and build SCALE library
      run: |
        set -euo pipefail

        scale_dir="${GITHUB_WORKSPACE}/scale"
        mkdir -p "${scale_dir}"
        cd "${scale_dir}"

        echo "=== Download SCALE ${SCALE_VERSION} ==="
        curl -fL --retry 3 \
          -o scale.tar.gz \
          "https://scale.riken.jp/archives/scale-${SCALE_VERSION}.tar.gz"

        echo "=== Extract SCALE ==="
        tar -xzf scale.tar.gz --strip-components=1

        echo "=== Build dc_utils ==="
        make -j 2 -C dc_utils

        echo "=== Build scalelib ==="
        make -j 2 -C scalelib/src

        echo "=== Check build outputs ==="
        test -d include
        test -d lib
        test -d scalelib/include
        test -n "$(find lib -maxdepth 1 -type f -print -quit)"

        echo "=== Libraries ==="
        ls -lh lib/

        echo "=== Package ==="
        mkdir -p "${PACKAGE_NAME}/scalelib/include"

        cp -a include "${PACKAGE_NAME}/"
        cp -a lib "${PACKAGE_NAME}/"
        cp -a scalelib/include/. \
          "${PACKAGE_NAME}/scalelib/include/"

        zip -qr "${PACKAGE_NAME}.zip" "${PACKAGE_NAME}"

        echo "=== Package contents ==="
        unzip -l "${PACKAGE_NAME}.zip" | tail -n 10
    
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PACKAGE_NAME }}
        path: ${{ github.workspace }}/scale/${{ env.PACKAGE_NAME }}.zip
        if-no-files-found: error
        retention-days: 1

    - name: Install SSH key
      uses: shimataro/ssh-key-action@v2
      with:
        key: ${{ secrets.SSH_KEY }}
        name: id_rsa
        known_hosts: ${{ secrets.KNOWN_HOSTS }}
        config: |
          Host scalelib_host
            HostName ${{ secrets.SCALELIB_SERVER_HOST }}
            User ${{ secrets.SCALELIB_SERVER_USER }}
            IdentityFile ~/.ssh/id_rsa
            IdentitiesOnly yes
            BatchMode yes

    - name: Send SCALE library to server
      run: |
        set -euo pipefail

        cd "${GITHUB_WORKSPACE}/scale"

        echo "=== Upload SCALE library ==="
        rsync -av --progress \
          "${PACKAGE_NAME}.zip" \
          "scalelib_host:FE-Project_GitActions/"

        echo "=== Upload completed ==="




  



