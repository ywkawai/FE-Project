&PARAM_CONST
  CONST_RADIUS = 1.0D0,
/
&PARAM_TEST
  NeGX  = 16,
  NeGY  = 16,
  NeGZ  = 2,
  PolyOrder = 7,
  NLocalMeshPerPrc = 1,
  dom_zmin = 0.0D0,
  dom_zmax = 0.1D0,     ! Thickness of the shell H (an aspect ratio of elements close to 1 is recommended at first)
  TestCaseName = 'Y22', ! 'Y22': Y = cos^2(lat) cos(2 lon), 'Y10': Y = sin(lat)
  BCType = 'NEUMANN',   ! 'NEUMANN' (dq/dz = 0) or 'DIRICHLET' (q = 0) at the bottom and top boundaries
  Do_NumErrorAnalysis = .true.,
/
&PARAM_POISSON3DGLOBAL_NUMERROR
  polyOrderErrorCheck = 10,
  LOG_OUT_BASENAME    = 'LOG_NUMERROR',
  LOG_STEP_INTERVAL   = 1,
/
&PARAM_Poisson3D_MG
  !- h-MG (horizontal coarsening only; the number of vertical elements is the same at all levels)
  !  Without h-MG: H_LEVEL_NUM = 0 (penalty_coef = 1.2 is recommended)
  H_LEVEL_NUM = 4,
  NeGX_list = 16, 8, 4, 2,
  NeGY_list = 16, 8, 4, 2,
  NeGZ_list = 2, 2, 2, 2,
  !- p-MG (use three or more levels when h-MG is used)
  P_LEVEL_NUM = 3,
  P_LEVEL_LIST = 7, 3, 1,
  !- V-cycle parameters
  MG_Vcyc_Num_Max = 30,
  MG_Threshold_Ratio_Residual_L2 = 1D-12,
  MG_Threshold_Residual_L2  = 1D-12,
  MG_Threshold_Residual_Max = 1D-12,
/
&PARAM_MGSmoother
  num_smooth_itr_max          = 5,
  residual_threshold_ratio_l2 = 1D-2,
  residual_threshold_l2       = 1D-8,
  residual_threshold_max      = 1D-8,
  history_residual_step       = 1,
  !- Solver for elementwise problems (only 'PCG' is supported for cubed-sphere meshes)
  elem_solver                    = 'PCG',
  !- For preconditioned conjugate gradient method
  num_smooth_itr_max_internal    = 50,
  residual_threshold_l2_internal = 1D-3,
  !- Coefficient C_tau in the penalty parameter.
  !  penalty_coef: p-MG levels, penalty_coef_hMG: h-MG levels (p = 1).
  !  If penalty_coef_hMG is not specified, penalty_coef is used on all levels.
  penalty_coef                   = 1.2D0,
  penalty_coef_hMG               = 1.6D0,
/
&PARAM_TIME
  TIME_DURATION                 = 1D0,
  TIME_DURATION_UNIT            = 'SEC',
  TIME_DT                       = 1D0,
  TIME_DT_UNIT                  = 'SEC',
/
&PARAM_FILE_HISTORY
 FILE_HISTORY_DEFAULT_BASENAME  = "history",
 FILE_HISTORY_DEFAULT_TINTERVAL = 1D0,
 FILE_HISTORY_DEFAULT_TUNIT     = "SEC",
 FILE_HISTORY_DEFAULT_TAVERAGE  = .false.,
 FILE_HISTORY_DEFAULT_DATATYPE  = "REAL8",
 FILE_HISTORY_OUTPUT_STEP0      = .true.,
/
&HISTORY_ITEM name='q'         /
&HISTORY_ITEM name='qexact'    /
&HISTORY_ITEM name='f'         /
