#--- Configuration file for run_spinup2: idealized regional moist convection (preset A) -------
#    Eh8Ez4P7: 8000 km x 8000 km (doubly periodic), 8 x 8 elements, NeZ = 4, p = 7
#    Run from Eh8Ez4P7/ : output files are written into run_spinup2/
&PARAM_IO
 IO_LOG_BASENAME = 'run_spinup2/LOG',
/
&PARAM_RESTART
  IN_BASENAME  = "run_spinup1/restart_00010126-000000.000",
  OUTPUT_FLAG  = .true.,
  OUT_BASENAME = 'run_spinup2/restart'
/
&PARAM_TIME
  TIME_STARTDATE       = 1, 1, 26, 0, 0, 0,
  TIME_STARTMS         = 0.D0,
  TIME_DURATION        = 150D0,
  TIME_DURATION_UNIT   = 'DAY',
  TIME_DT              = 120D0,
  TIME_DT_UNIT         = 'SEC',
/
&PARAM_USER
  USER_do          = .true.,
  in_filebase_Tref = "run_spinup1/history", ! T_ref = horizontal mean of T in the initial state of this run
  SPONGE_HEIGHT    = 15.0D3,
  TAU_SPONGE       = 21600D0,
/
#--- In the run phase, SFC_THETA is the ground temperature used by the surface flux scheme.
&PARAM_EXP
  SFC_THETA = 305.0D0,
/
&PARAM_USER_BLmixing
  BL_TAPER_Z = 600D0,
  BL_SFC_STAB_VDIFFCoef = 250.0D0,
/
#** ATMOS ******************************************************
&PARAM_ATMOS
  ACTIVATE_FLAG   = .true.,
  TIME_DT         = 120D0,
  TIME_DT_UNIT    = 'SEC',
  TIME_DT_RESTART      = 25D0,
  TIME_DT_RESTART_UNIT = 'DAY',
  ATMOS_DYN_DO    = .true.,
  ATMOS_PHY_SF_DO = .true.,
  ATMOS_PHY_MP_DO = .true.,
/
&PARAM_ATMOS_MESH
  dom_xmin         =   0.0D3,
  dom_xmax         =   8000D3,
  isPeriodicX      = .true.,
  dom_ymin         =   0.0D3,
  dom_ymax         =   8000D3,
  isPeriodicY      = .true.,
  dom_zmin         =   0.0D0,
  dom_zmax         =   30.0D3,
  NprcX            = 4,
  NeX              = 2,
  NprcY            = 2,
  NeY              = 4,
  NeZ              = 4,
  Fz               = 0.0D0, 2760D0, 10340.0D0, 19528.0D0, 30000D0,
  PolyOrder_h      = 7,
  PolyOrder_v      = 7,
  Element_Operation_Type = 'TensorProd3D',
/
&PARAM_ATMOS_VARS
  CHECK_RANGE = .true. ,
  CHECK_TOTAL = .false.,
/
#** ATMOS / DYN ******************************************************
&PARAM_ATMOS_DYN
  EQS_TYPE           = "NONHYDRO3D_HEVI",
  !-
  TINTEG_TYPE        = 'IMEX_ARK324', ! [IMEX_ARK_232, IMEX_ARK324, RK_TVD_3]
  TINTEG_TYPE_TRACER = 'ERK_SSP_4s3o',
  TIME_DT       = 60D0,
  TIME_DT_UNIT  = 'SEC',
  !-
  MODALFILTER_FLAG  = .true.,
  NUMDIFF_FLAG      = .false.,
  TRACERADV_MODALFILTER_FLAG = .true.,
/
&PARAM_ATMOS_DYN_MODALFILTER
  MF_ETAC_h  = 0D0,
  MF_ALPHA_h = 2.5D0,
  MF_ORDER_h = 16,
  MF_ETAC_v  = 0D0,
  MF_ALPHA_v = 4D0,
  MF_ORDER_v = 12,
/
&PARAM_ATMOS_DYN_TRACER_MODALFILTER
  MF_ETAC_h  = 0D0,
  MF_ALPHA_h = 2.5D0,
  MF_ORDER_h = 16,
  MF_ETAC_v  = 0D0,
  MF_ALPHA_v = 4D0,
  MF_ORDER_v = 12,
/
&PARAM_ATMOS_DYN_BND
  btm_vel_bc   = 'SLIP',
  top_vel_bc   = 'SLIP',
  north_vel_bc = 'SLIP',
  south_vel_bc = 'SLIP',
  east_vel_bc  = 'SLIP',
  west_vel_bc  = 'SLIP',
  btm_thermal_bc   = 'ADIABATIC',
  top_thermal_bc   = 'ADIABATIC',
  north_thermal_bc = 'ADIABATIC',
  south_thermal_bc = 'ADIABATIC',
  west_thermal_bc  = 'ADIABATIC',
  east_thermal_bc  = 'ADIABATIC',
/
#*** ATMOS / PHY / SURFACE
&PARAM_ATMOS_PHY_SFC
  TIME_DT      = 120D0,
  TIME_DT_UNIT = "SEC",
  SFCFLX_TYPE  = "SIMPLE",
/
&PARAM_ATMOS_PHY_SF_SIMPLE
  ATMOS_PHY_SF_Const_Cm = 0.0D0,
  ATMOS_PHY_SF_Const_Ch = 0.0044D0,
  ATMOS_PHY_SF_Const_Ce = 0.0044D0,
/
#** ATMOS / PHYS / Microcloud physics ******************************************************
#   Spin-up is common to all coupling cases: no pre-/post-processing (primary container, no post filter).
&PARAM_ATMOS_PHY_MP
  TIME_DT = 1800.0D0,
  MP_TYPE = 'LSCOND',
  PostFilterOnlyApplyRHOH = .true., 
  PostGLFilter_Type = 'ModalFilter',
  PostModalFilter_ALPHA_h = 1D0,
  PostModalFilter_ORDER_h = 2,
  PostModalFilter_ALPHA_v = 0.0D0,
  PostModalFilter_ORDER_v = 2,  
/

#*** OUTPUT *******************************************
&PARAM_FILE_HISTORY
 FILE_HISTORY_DEFAULT_BASENAME  = "run_spinup2/history",
 FILE_HISTORY_DEFAULT_TINTERVAL = 2.5D0,
 FILE_HISTORY_DEFAULT_TUNIT     = "DAY",
 FILE_HISTORY_DEFAULT_TAVERAGE  = .false.,
 FILE_HISTORY_DEFAULT_DATATYPE  = "REAL4",
 FILE_HISTORY_OUTPUT_STEP0      = .true.,
/
&HISTORY_ITEM name='DDENS'      /
&HISTORY_ITEM name='U'          /
&HISTORY_ITEM name='V'          /
&HISTORY_ITEM name='W'          /
&HISTORY_ITEM name='QV'         /
&HISTORY_ITEM name='T'          /
&HISTORY_ITEM name='PT'         /
&HISTORY_ITEM name='PRES'       /
&HISTORY_ITEM name='RAIN'       /
&HISTORY_ITEM name='MP_RHOH'    /

#*** Statistics *******************************************
&PARAM_MESHFIELD_STATISTICS
 use_globalcomm = .true.,
/
&PARAM_MONITOR
  MONITOR_OUT_BASENAME  = "run_spinup2/monitor",
  MONITOR_STEP_INTERVAL = 15,
/
&MONITOR_ITEM name='DDENS' /
&MONITOR_ITEM name='ENGT'  /
&MONITOR_ITEM name='ENGK'  /
&MONITOR_ITEM name='ENGI'  /
&MONITOR_ITEM name='ENGP'  /
