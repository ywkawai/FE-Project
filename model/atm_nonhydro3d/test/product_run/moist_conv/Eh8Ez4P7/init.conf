#--- Configuration file for making initial data: idealized regional moist convection (preset A) -------
#    Eh8Ez4P7: 8000 km x 8000 km (doubly periodic), 8 x 8 elements, NeZ = 4, p = 7
#    Run from Eh8Ez4P7/ : output files are written into init/
&PARAM_IO
 IO_LOG_BASENAME = 'init/init_LOG',
/
&PARAM_MKINIT
  initname = 'IdealizedMoistConv',
/
&PARAM_RESTART
  OUTPUT_FLAG  = .true.,
  OUT_BASENAME = 'init/init'
/
&PARAM_TIME
  TIME_STARTDATE       = 1, 1, 1, 0, 0, 0,
  TIME_STARTMS         = 0.D0,
/
&PARAM_USER
  USER_do = .false.,
/
#--- Basic state (preset A). In the init phase, SFC_THETA is the potential temperature of the basic state at the surface.
&PARAM_EXP
  SFC_THETA         = 300.0D0,
  SFC_PRES          = 101325.0D0,
  ENV_PT_LAPS_BL    = 0.3D-3,
  ENV_PT_LAPS_FT    = 3.0D-3,
  ENV_PT_LAPS_STR   = 6.0D-3,
  ENV_PBL_Z         = 1200.0D0,
  ENV_PBL_W         =  400.0D0,
  ENV_TRO_Z         = 11000.0D0,
  ENV_TRO_W         =  1000.0D0,
  ENV_MID_Z         = 5000.0D0,
  ENV_MID_W         = 2000.0D0,
  ENV_RH_SFC        = 0.85D0,
  ENV_RH_MID        = 0.55D0,
  ENV_RH_UP         = 0.20D0,
  ENV_U             = 0.0D0,
  ENV_V             = 0.0D0,
  RANDOM_THETA      = 0.01D0,
  RANDOM_THETA_ZTOP = 1200.0D0,
  RANDOM_ISEED      = 1,
/
#** ATMOS ******************************************************
&PARAM_ATMOS
  ACTIVATE_FLAG   = .true.,
  ATMOS_DYN_DO    = .true.,
  ATMOS_PHY_SF_DO = .true.,
  ATMOS_PHY_MP_DO = .true.,
/
&PARAM_ATMOS_MESH
  dom_xmin         =   0.0D3,
  dom_xmax         =   8000D3,
  isPeriodicX      = .true.,
  dom_ymin         =   0.0D3,
  dom_ymax         =   8000D3,
  isPeriodicY      = .true.,
  dom_zmin         =   0.0D0,
  dom_zmax         =   30.0D3,
  NprcX            = 4,
  NeX              = 2,
  NprcY            = 2,
  NeY              = 4,
  NeZ              = 4,
  Fz               = 0.0D0, 2760D0, 10340.0D0, 19528.0D0, 30000D0,
  PolyOrder_h      = 7,
  PolyOrder_v      = 7,
  Element_Operation_Type = 'TensorProd3D',
/
#** ATMOS / DYN ******************************************************
&PARAM_ATMOS_DYN
  EQS_TYPE         = "NONHYDRO3D_HEVI",
/
#*** ATMOS / PHY / SURFACE
&PARAM_ATMOS_PHY_SFC
  SFCFLX_TYPE  = "SIMPLE",
/
#** ATMOS / PHYS / Microcloud physics ******************************************************
&PARAM_ATMOS_PHY_MP
  MP_TYPE = 'LSCOND',
/
